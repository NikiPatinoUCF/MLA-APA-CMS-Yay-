<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play - Edit Quest</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- Game Container -->
  <div class="game-container">
    <!-- Game Header -->
    <header class="game-header">
      <div class="game-header-content">
        <div class="game-title" id="game-title">Edit Quest</div>
        <div class="game-stats">
          <div class="game-stat">
            <span class="game-stat-label">Score</span>
            <span class="game-stat-value" id="current-score">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Streak</span>
            <span class="game-stat-value streak" id="current-streak">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Progress</span>
            <span class="game-stat-value" id="progress-text">0/0</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Game Content -->
    <main class="game-content">
      <div class="challenge-card" id="challenge-card">
        <!-- Challenge content will be dynamically inserted -->
      </div>
    </main>
  </div>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedback-modal">
    <div class="modal feedback-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="feedback-title">Result</h2>
        <button class="modal-close" onclick="closeFeedback()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="feedback-content"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="nextQuestion()">Continue</button>
      </div>
    </div>
  </div>

  <!-- Level Complete Modal -->
  <div class="modal-overlay" id="complete-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Level Complete! 🎉</h2>
      </div>
      <div class="modal-body">
        <div id="complete-content"></div>
      </div>
      <div class="modal-footer">
        <a href="level-selection.html" class="btn btn-outline" id="back-to-levels">Back to Levels</a>
        <button class="btn btn-primary" id="next-level-btn" onclick="nextLevel()" style="display:none">Next Level</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/question-bank.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/game-engine.js"></script>

  <script>
    // Get game parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const guide = urlParams.get('guide') || 'mla';
    const region = urlParams.get('region') || 'comma-castle';
    const difficulty = urlParams.get('difficulty') || 'beginner';

    // Game state
    let game = null;
    let selectedAnswer = null;

    // Initialize game
    document.addEventListener('DOMContentLoaded', function() {
      initializeGame();
    });

    function initializeGame() {
      // Initialize game engine
      game = GameEngine.initGame({
        guide: guide,
        region: region,
        difficulty: difficulty,
        shuffle: true,
        callbacks: {
          onAnswer: handleAnswerResult,
          onComplete: handleLevelComplete
        }
      });

      // Update header
      const guideNames = { mla: 'MLA', apa: 'APA', cms: 'CMS' };
      document.getElementById('game-title').textContent = `${guideNames[guide]} - ${capitalize(difficulty)}`;

      // Load first question
      loadQuestion();
    }

    function loadQuestion() {
      const question = game.getCurrentQuestion();
      if (!question) {
        game.completeLevel();
        return;
      }

      selectedAnswer = null;

      // Update progress
      updateStats();

      // Render question based on type
      const card = document.getElementById('challenge-card');

      switch (question.type) {
        case 'multiple-choice':
          renderMultipleChoice(question);
          break;
        case 'true-false':
          renderTrueFalse(question);
          break;
        case 'fill-in-blank':
          renderFillInBlank(question);
          break;
        default:
          renderMultipleChoice(question);
      }
    }

    function renderMultipleChoice(question) {
      const card = document.getElementById('challenge-card');

      card.innerHTML = `
        <div class="challenge-header">
          <span class="challenge-type">Multiple Choice</span>
          ${question.timeLimit ? `<span class="challenge-timer" id="timer"></span>` : ''}
        </div>
        <div class="challenge-question">${question.question}</div>
        <div class="options-container" id="options-container">
          ${question.options.map((option, index) => `
            <button class="option-button" onclick="selectOption('${escapeHtml(option)}')" data-option="${escapeHtml(option)}">
              ${option}
            </button>
          `).join('')}
        </div>
        <div class="game-nav">
          <button class="btn btn-primary" onclick="submitAnswer()" id="submit-btn">Submit Answer</button>
          <button class="btn btn-outline" onclick="quitGame()">Quit Game</button>
        </div>
      `;

      if (question.timeLimit) {
        startTimer(question.timeLimit);
      }
    }

    function renderTrueFalse(question) {
      const card = document.getElementById('challenge-card');

      card.innerHTML = `
        <div class="challenge-header">
          <span class="challenge-type">True or False</span>
          ${question.timeLimit ? `<span class="challenge-timer" id="timer"></span>` : ''}
        </div>
        <div class="challenge-question">${question.question}</div>
        <div class="true-false-container">
          <button class="true-false-button true" onclick="selectTrueFalse(true)">
            True
          </button>
          <button class="true-false-button false" onclick="selectTrueFalse(false)">
            False
          </button>
        </div>
        <div class="game-nav">
          <button class="btn btn-outline" onclick="quitGame()">Quit Game</button>
        </div>
      `;

      if (question.timeLimit) {
        startTimer(question.timeLimit);
      }
    }

    function renderFillInBlank(question) {
      const card = document.getElementById('challenge-card');

      card.innerHTML = `
        <div class="challenge-header">
          <span class="challenge-type">Fill in the Blank</span>
          ${question.timeLimit ? `<span class="challenge-timer" id="timer"></span>` : ''}
        </div>
        <div class="challenge-question">${question.question}</div>
        <div class="fill-blank-container">
          <input type="text" class="fill-blank-input" id="fill-input" placeholder="Type your answer here..." />
        </div>
        <div class="game-nav">
          <button class="btn btn-primary" onclick="submitFillBlank()">Submit Answer</button>
          <button class="btn btn-outline" onclick="quitGame()">Quit Game</button>
        </div>
      `;

      // Focus on input
      document.getElementById('fill-input').focus();

      // Submit on Enter key
      document.getElementById('fill-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          submitFillBlank();
        }
      });

      if (question.timeLimit) {
        startTimer(question.timeLimit);
      }
    }

    function selectOption(option) {
      // Remove previous selection
      document.querySelectorAll('.option-button').forEach(btn => {
        btn.classList.remove('selected');
      });

      // Mark selected
      event.target.classList.add('selected');
      selectedAnswer = option;
    }

    function selectTrueFalse(value) {
      selectedAnswer = value;
      game.submitAnswer(value);
    }

    function submitAnswer() {
      if (selectedAnswer === null) {
        alert('Please select an answer first!');
        return;
      }

      game.submitAnswer(selectedAnswer);
    }

    function submitFillBlank() {
      const input = document.getElementById('fill-input');
      const answer = input.value.trim();

      if (!answer) {
        alert('Please enter an answer!');
        return;
      }

      game.submitAnswer(answer);
    }

    function handleAnswerResult(result, streak) {
      // Update stats
      updateStats();

      // Show feedback modal
      showFeedback(result);

      // Disable inputs
      disableInputs();
    }

    function showFeedback(result) {
      const modal = document.getElementById('feedback-modal');
      const feedbackModal = modal.querySelector('.feedback-modal');
      const title = document.getElementById('feedback-title');
      const content = document.getElementById('feedback-content');

      // Set correct/incorrect class
      feedbackModal.className = 'modal feedback-modal ' + (result.correct ? 'correct' : 'incorrect');

      // Set title
      title.textContent = result.correct ? 'Correct! ✓' : 'Incorrect ✗';
      title.style.color = result.correct ? 'var(--color-success)' : 'var(--color-error)';

      // Set content
      const question = game.getCurrentQuestion();

      content.innerHTML = `
        <div style="margin-bottom: var(--spacing-lg);">
          <strong>Your answer:</strong> ${result.userAnswer}
        </div>
        ${!result.correct ? `
          <div style="margin-bottom: var(--spacing-lg);">
            <strong>Correct answer:</strong> ${result.correctAnswer}
          </div>
        ` : ''}
        <div style="margin-bottom: var(--spacing-lg);">
          <strong>Explanation:</strong><br>
          ${question.explanation}
        </div>
        <div class="alert ${result.correct ? 'alert-success' : 'alert-info'}">
          <strong>Score:</strong> +${result.score} points
          ${result.breakdown.streakBonus > 0 ? `<br><strong>Streak Bonus:</strong> +${result.breakdown.streakBonus} points` : ''}
          ${result.breakdown.timeBonus > 0 ? `<br><strong>Time Bonus:</strong> +${result.breakdown.timeBonus} points` : ''}
        </div>
      `;

      modal.classList.add('active');
    }

    function closeFeedback() {
      document.getElementById('feedback-modal').classList.remove('active');
    }

    function nextQuestion() {
      closeFeedback();

      if (game.hasNextQuestion()) {
        game.nextQuestion();
        loadQuestion();
      } else {
        game.completeLevel();
      }
    }

    function handleLevelComplete(completionData) {
      const modal = document.getElementById('complete-modal');
      const content = document.getElementById('complete-content');
      const backBtn = document.getElementById('back-to-levels');

      // Update back button URL
      backBtn.href = `level-selection.html?guide=${guide}`;

      // Render completion data
      content.innerHTML = `
        <div class="level-complete">
          <h2 class="level-complete-title">Level Complete!</h2>
          <div class="level-complete-stats">
            <div class="level-complete-stat">
              <div class="level-complete-stat-value">${completionData.finalScore}</div>
              <div class="level-complete-stat-label">Total Score</div>
            </div>
            <div class="level-complete-stat">
              <div class="level-complete-stat-value">${completionData.questionsCorrect}/${completionData.questionsTotal}</div>
              <div class="level-complete-stat-label">Correct</div>
            </div>
            <div class="level-complete-stat">
              <div class="level-complete-stat-value">${completionData.accuracy}%</div>
              <div class="level-complete-stat-label">Accuracy</div>
            </div>
            <div class="level-complete-stat">
              <div class="level-complete-stat-value">${completionData.maxStreak}</div>
              <div class="level-complete-stat-label">Best Streak</div>
            </div>
          </div>
          ${completionData.newBadges && completionData.newBadges.length > 0 ? `
            <div class="alert alert-success">
              <strong>New Badges Earned! 🎉</strong><br>
              ${completionData.newBadges.map(badge => `${badge.icon} ${badge.name}`).join('<br>')}
            </div>
          ` : ''}
          <div style="margin-top: var(--spacing-xl);">
            <strong>Current Rank:</strong> ${completionData.rank.name}
          </div>
        </div>
      `;

      modal.classList.add('active');
    }

    function updateStats() {
      const stats = game.getCurrentStats();
      const progress = game.getProgress();

      document.getElementById('current-score').textContent = stats.score;
      document.getElementById('current-streak').textContent = stats.streak;
      document.getElementById('progress-text').textContent = `${progress.current}/${progress.total}`;
    }

    function disableInputs() {
      document.querySelectorAll('.option-button, .true-false-button, .fill-blank-input').forEach(el => {
        el.disabled = true;
      });
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.disabled = true;
    }

    function startTimer(seconds) {
      // Timer implementation (optional)
      // For simplicity, we'll skip this for now
    }

    function quitGame() {
      if (confirm('Are you sure you want to quit? Your progress will not be saved.')) {
        window.location.href = `level-selection.html?guide=${guide}`;
      }
    }

    function nextLevel() {
      // Logic to determine next level
      window.location.href = `level-selection.html?guide=${guide}`;
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
